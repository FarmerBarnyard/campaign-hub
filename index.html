<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 2026-09-02 security review: this repo had no CSP at all before this.
     img-src needs https://api.barnyard.site (not just 'self') for embedded
     map images (see lib/wikilink.js's img.src) -- confirmed neither
     map-dungeon.js nor map-overworld.js ever assigns a data:/blob: URI to
     an <img> src (canvas.toDataURL() output only ever becomes an <a
     download> href or a POST body field, never an image src), so neither
     scheme needs to be in img-src here. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://api.barnyard.site; style-src 'self'; script-src 'self'; img-src 'self' https://api.barnyard.site; base-uri 'self'; form-action 'none';">
<title>Campaign Hub</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-header">
  <div class="app-header-main">
    <p class="wordmark">Campaign Hub</p>
    <nav class="app-nav">
      <a href="#/" class="nav-link">Library</a>
      <a href="#/map/dungeon" class="nav-link">Dungeon map</a>
      <a href="#/map/overworld" class="nav-link">Overworld map</a>
    </nav>
  </div>
  <div class="auth-status" id="auth-status"></div>
</header>

<main id="app"></main>

<!-- Cache-busting: every script tag shares one `v` query param, bumped
     together on any deploy that touches JS. Without this, a returning
     visitor's browser can revalidate/refetch these files independently
     (different original fetch times => different effective cache
     lifetimes under Cloudflare's max-age=14400), so a page load can end up
     mixing an old cached file with a new one. Confirmed in production:
     stale lib/noise.js (pre-dating makeRidgedFbmSampler) paired with a
     fresh views/map-overworld.js (which calls it) threw immediately, and
     since the overworld canvas has an explicit `background: #000` in
     styles.css, an unpainted canvas rendered as a literal solid black box
     -- reported by the account owner and reproduced exactly by replaying
     that old/new file pairing. Bumping `v` here forces every script to be
     refetched together the next time a visitor's browser fetches this
     (also-cached, but shorter-lived in practice since it's the page itself)
     index.html, so they can never end up with a same-deploy mismatch again. -->
<script src="auth-gate.js?v=35"></script>
<script src="lib/api.js?v=35"></script>
<script src="lib/wikilink.js?v=35"></script>
<script src="lib/noise.js?v=35"></script>
<script src="lib/voronoi-mesh.js?v=35"></script>
<script src="lib/terrain-grid.js?v=35"></script>
<script src="lib/watercolor-wash.js?v=35"></script>
<script src="lib/hydrology.js?v=35"></script>
<script src="lib/map-themes.js?v=35"></script>
<script src="lib/settlement-names.js?v=35"></script>
<script src="lib/map-biome-zones.js?v=35"></script>
<script src="lib/campaign-themes.js?v=35"></script>
<script src="lib/zip-writer.js?v=35"></script>
<script src="lib/room-shapes.js?v=35"></script>
<script src="lib/landmark-sites.js?v=35"></script>
<script src="lib/landmark-lore.js?v=35"></script>
<script src="lib/dungeon-lore.js?v=35"></script>
<script src="lib/dungeon-props.js?v=35"></script>
<script src="lib/settlement-poi.js?v=35"></script>
<script src="views/library.js?v=35"></script>
<script src="views/campaign.js?v=35"></script>
<script src="views/new-note.js?v=35"></script>
<script src="views/map-dungeon.js?v=35"></script>
<script src="views/map-overworld.js?v=35"></script>

<script src="app.js?v=35"></script>
</body>
</html>
